name: Theme Tests
on: [push, pull_request]

jobs:
  validate-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. Theme Validation & Linting
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme
      
      - name: Theme Check
        run: shopify theme check --fail-level=error
        
      - name: Validate Liquid Templates
        run: |
          echo "Checking Liquid syntax..."
          find . -name "*.liquid" -exec echo "Checking: {}" \;
          shopify theme check --output=json > theme_check_results.json || true
          cat theme_check_results.json

      # 2. JavaScript & CSS Quality Checks
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          npm init -y
          npm install --save-dev eslint stylelint postcss stylelint-config-standard
          
      - name: Create ESLint config
        run: |
          cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "browser": true,
              "es6": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": 2020,
              "sourceType": "module"
            },
            "rules": {
              "no-unused-vars": "error",
              "no-undef": "error",
              "no-console": "warn",
              "semi": ["error", "always"],
              "quotes": ["error", "single"]
            }
          }
          EOF
          
      - name: Create StyleLint config
        run: |
          cat > .stylelintrc.json << 'EOF'
          {
            "extends": "stylelint-config-standard",
            "rules": {
              "indentation": 2,
              "string-quotes": "single",
              "no-duplicate-selectors": true,
              "color-hex-case": "lower",
              "color-hex-length": "short",
              "selector-max-id": 0,
              "max-nesting-depth": 3
            }
          }
          EOF
          
      - name: Lint JavaScript
        run: |
          if [ -d "assets" ] && [ "$(find assets/ -name "*.js" | wc -l)" -gt 0 ]; then
            npx eslint assets/*.js --format=compact
          else
            echo "No JavaScript files found to lint"
          fi
          
      - name: Lint CSS
        run: |
          if [ -d "assets" ] && [ "$(find assets/ -name "*.css" | wc -l)" -gt 0 ]; then
            npx stylelint "assets/*.css" --formatter=compact
          else
            echo "No CSS files found to lint"
          fi

      # 3. Performance & Asset Validation
      - name: Asset Size Check
        run: |
          echo "=== Checking Asset Sizes ==="
          
          # Check JavaScript files
          find assets/ -name "*.js" -size +100k -exec echo "⚠️ Large JS file: {} ($(stat -f%z '{}' 2>/dev/null || stat -c%s '{}') bytes)" \; || true
          
          # Check CSS files
          find assets/ -name "*.css" -size +50k -exec echo "⚠️ Large CSS file: {} ($(stat -f%z '{}' 2>/dev/null || stat -c%s '{}') bytes)" \; || true
          
          # Calculate total bundle sizes
          if [ -d "assets" ]; then
            total_js=$(find assets/ -name "*.js" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo 0)
            total_css=$(find assets/ -name "*.css" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo 0)
            
            echo "Total JS size: ${total_js} bytes"
            echo "Total CSS size: ${total_css} bytes"
            
            # Fail if bundles are too large
            if [ "$total_js" -gt 500000 ]; then
              echo "❌ JavaScript bundle too large: ${total_js} bytes (limit: 500KB)"
              exit 1
            fi
            
            if [ "$total_css" -gt 100000 ]; then
              echo "❌ CSS bundle too large: ${total_css} bytes (limit: 100KB)"
              exit 1
            fi
            
            echo "✅ Asset sizes are within limits"
          fi
          
      - name: Image Optimization Check
        run: |
          echo "=== Checking Image Sizes ==="
          find . -name "*.jpg" -o -name "*.png" -o -name "*.jpeg" | while read img; do
            if [ -f "$img" ]; then
              size=$(stat -f%z "$img" 2>/dev/null || stat -c%s "$img")
              if [ "$size" -gt 500000 ]; then
                echo "⚠️ Large image file: $img (${size} bytes)"
              fi
            fi
          done
          echo "✅ Image check completed"

      # 4. Schema & Settings Validation
      - name: Validate Settings Schema
        run: |
          if [ -f "config/settings_schema.json" ]; then
            python3 -c "
import json
import sys

try:
    with open('config/settings_schema.json', 'r') as f:
        schema = json.load(f)
    print('✅ Settings schema is valid JSON')
    
    # Check for required fields and potential issues
    for i, section in enumerate(schema):
        if 'settings' in section:
            for j, setting in enumerate(section['settings']):
                # Check ID length
                if 'id' in setting and len(setting['id']) > 50:
                    print(f'⚠️ Setting ID too long at section {i}, setting {j}: {setting[\"id\"]}')
                
                # Check for required fields in certain setting types
                if setting.get('type') == 'range':
                    required_fields = ['min', 'max']
                    for field in required_fields:
                        if field not in setting:
                            print(f'⚠️ Range setting missing {field} at section {i}, setting {j}')
                
                # Check for valid setting types
                valid_types = ['text', 'textarea', 'image_picker', 'radio', 'select', 
                              'checkbox', 'number', 'range', 'color', 'header', 'paragraph']
                if 'type' in setting and setting['type'] not in valid_types:
                    print(f'⚠️ Unknown setting type at section {i}, setting {j}: {setting[\"type\"]}')
                    
    print('✅ Schema validation completed')
    
except json.JSONDecodeError as e:
    print(f'❌ Settings schema JSON error: {e}')
    sys.exit(1)
except Exception as e:
    print(f'❌ Settings schema validation error: {e}')
    sys.exit(1)
            "
          else
            echo "⚠️ No settings_schema.json found"
          fi
          
      - name: Validate Locales
        run: |
          echo "=== Validating Locale Files ==="
          if [ -d "locales" ]; then
            for locale_file in locales/*.json; do
              if [ -f "$locale_file" ]; then
                echo "Checking $locale_file..."
                python3 -c "
import json
import sys
try:
    with open('$locale_file', 'r', encoding='utf-8') as f:
        json.load(f)
    print('✅ $locale_file is valid')
except Exception as e:
    print('❌ $locale_file error:', e)
    sys.exit(1)
                "
              fi
            done
          else
            echo "⚠️ No locales directory found"
          fi

      # Security Check
      - name: Security Scan
        run: |
          echo "=== Security Check ==="
          
          # Check for potentially dangerous JavaScript patterns
          if find assets/ -name "*.js" -exec grep -l "eval\|innerHTML\|document.write" {} \; 2>/dev/null | head -1; then
            echo "⚠️ Potentially unsafe JavaScript patterns found"
            find assets/ -name "*.js" -exec grep -Hn "eval\|innerHTML\|document.write" {} \;
          else
            echo "✅ No obvious security issues found in JavaScript"
          fi
          
          # Check for hardcoded secrets (basic check)
          if grep -r "password\|secret\|key.*=" --include="*.liquid" --include="*.js" --include="*.css" . | grep -v "keyframes\|key:\|keyboard" | head -5; then
            echo "⚠️ Potential hardcoded credentials found (review manually)"
          else
            echo "✅ No obvious hardcoded credentials found"
          fi

      # Summary Report
      - name: Generate Test Summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          echo "Theme validation completed"
          echo "Asset optimization checked"
          echo "Security scan completed"
          echo "Schema validation completed"
          echo ""
          echo "Review the logs above for any warnings or errors."