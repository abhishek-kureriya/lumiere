name: Upload Products to Shopify

on:
  push:
    branches:
      - main
    paths:
      - 'products.csv'
      - 'data/products.csv'
  workflow_dispatch:
    inputs:
      csv_file:
        description: 'Path to CSV file (relative to repo root)'
        required: false
        default: 'products.csv'

jobs:
  upload-products:
    name: Upload products from CSV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Determine CSV file path
        id: csv-path
        run: |
          if [ -n "${{ github.event.inputs.csv_file }}" ]; then
            echo "csv_file=${{ github.event.inputs.csv_file }}" >> $GITHUB_OUTPUT
          elif [ -f "products.csv" ]; then
            echo "csv_file=products.csv" >> $GITHUB_OUTPUT
          elif [ -f "data/products.csv" ]; then
            echo "csv_file=data/products.csv" >> $GITHUB_OUTPUT
          else
            echo "No CSV file found"
            exit 1
          fi

      - name: Upload products to Shopify
        env:
          SHOPIFY_STORE: ${{ env.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ env.SHOPIFY_ACCESS_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_STORE" ] || [ -z "$SHOPIFY_ACCESS_TOKEN" ]; then
            echo "Error: Missing SHOPIFY_STORE or SHOPIFY_ACCESS_TOKEN secrets"
            exit 1
          fi
          python3 scripts/upload_products.py -i "${{ steps.csv-path.outputs.csv_file }}"

      - name: Upload summary
        if: always()
        run: |
          echo "### Product Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "CSV file: ${{ steps.csv-path.outputs.csv_file }}" >> $GITHUB_STEP_SUMMARY
