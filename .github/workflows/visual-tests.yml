name: Visual Regression Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      # Install dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright @playwright/test
          npx playwright install chromium
          
      # Deploy to test theme first
      - name: Deploy to Test Theme
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          npm install -g @shopify/cli @shopify/theme
          
          # Create a unique test theme name
          TEST_THEME="CI-Test-$(date +%s)"
          echo "TEST_THEME_NAME=$TEST_THEME" >> $GITHUB_ENV
          
          # Deploy to test theme
          shopify theme push --store "$SHOPIFY_STORE" --password "$SHOPIFY_TOKEN" --theme "$TEST_THEME" --force --json || {
            echo "Failed to deploy test theme"
            exit 1
          }
          
          # Get the theme preview URL
          STORE_URL="https://$SHOPIFY_STORE"
          echo "STORE_URL=$STORE_URL" >> $GITHUB_ENV
          
      - name: Wait for deployment
        run: sleep 30
        
      # Run visual tests
      - name: Run Visual Regression Tests
        env:
          STORE_URL: ${{ env.STORE_URL }}
        run: |
          # Create test directory
          mkdir -p tests/visual
          
          # Create Playwright config
          cat > playwright.config.js << 'EOF'
          module.exports = {
            testDir: './tests/visual',
            timeout: 30000,
            use: {
              baseURL: process.env.STORE_URL,
              screenshot: 'only-on-failure',
              video: 'retain-on-failure'
            },
            projects: [
              {
                name: 'Desktop Chrome',
                use: {
                  browserName: 'chromium',
                  viewport: { width: 1280, height: 720 }
                }
              },
              {
                name: 'Mobile Chrome',
                use: {
                  browserName: 'chromium',
                  viewport: { width: 375, height: 667 }
                }
              }
            ]
          };
          EOF
          
          # Create basic visual tests
          cat > tests/visual/homepage.spec.js << 'EOF'
          const { test, expect } = require('@playwright/test');
          
          test.describe('Homepage Visual Tests', () => {
            test('Homepage loads without console errors', async ({ page }) => {
              const errors = [];
              page.on('console', msg => {
                if (msg.type() === 'error') {
                  errors.push(msg.text());
                }
              });
              
              await page.goto('/', { waitUntil: 'networkidle' });
              
              // Check that critical elements are visible
              await expect(page.locator('header')).toBeVisible();
              await expect(page.locator('main')).toBeVisible();
              
              // Log any console errors
              if (errors.length > 0) {
                console.log('Console errors found:', errors);
              }
              
              // Take screenshot for visual comparison
              await page.screenshot({ path: 'homepage-screenshot.png', fullPage: true });
            });
            
            test('Navigation works correctly', async ({ page }) => {
              await page.goto('/');
              
              // Test main navigation
              const nav = page.locator('nav, .header__menu');
              if (await nav.isVisible()) {
                await expect(nav).toBeVisible();
              }
              
              // Check for broken links (sample a few)
              const links = await page.locator('a[href]').all();
              const sampleLinks = links.slice(0, 5); // Test first 5 links
              
              for (const link of sampleLinks) {
                const href = await link.getAttribute('href');
                if (href && href.startsWith('/') && !href.startsWith('//')) {
                  console.log(`Testing link: ${href}`);
                  const response = await page.goto(href, { waitUntil: 'domcontentloaded' });
                  expect(response.status()).toBeLessThan(400);
                  await page.goBack();
                }
              }
            });
            
            test('Performance check', async ({ page }) => {
              await page.goto('/');
              
              // Check page load performance
              const performanceTiming = await page.evaluate(() => {
                return JSON.stringify(window.performance.timing);
              });
              
              const timing = JSON.parse(performanceTiming);
              const loadTime = timing.loadEventEnd - timing.navigationStart;
              
              console.log(`Page load time: ${loadTime}ms`);
              expect(loadTime).toBeLessThan(5000); // 5 seconds max
              
              // Check for large images
              const images = await page.locator('img').all();
              for (const img of images) {
                const src = await img.getAttribute('src');
                if (src) {
                  const naturalWidth = await img.evaluate(el => el.naturalWidth);
                  const naturalHeight = await img.evaluate(el => el.naturalHeight);
                  
                  // Warn about very large images
                  if (naturalWidth > 2000 || naturalHeight > 2000) {
                    console.log(`Large image found: ${src} (${naturalWidth}x${naturalHeight})`);
                  }
                }
              }
            });
          });
          EOF
          
          # Run the tests
          npx playwright test --reporter=list
          
      # Clean up test theme
      - name: Cleanup Test Theme
        if: always()
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          TEST_THEME_NAME: ${{ env.TEST_THEME_NAME }}
        run: |
          if [ ! -z "$TEST_THEME_NAME" ]; then
            echo "Cleaning up test theme: $TEST_THEME_NAME"
            shopify theme delete --store "$SHOPIFY_STORE" --password "$SHOPIFY_TOKEN" --theme "$TEST_THEME_NAME" --force || echo "Failed to delete test theme"
          fi
          
      # Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: visual-test-results
          path: |
            test-results/
            *.png
            playwright-report/
          retention-days: 30