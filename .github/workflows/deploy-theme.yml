name: Test and Deploy Shopify Theme

on:
  push:
    branches:
      - main
      - develop
      - staging
      - '**'  # All branches
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Run tests first
  test:
    name: Run Theme Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Run the theme validation tests
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme
      
      - name: Theme Check
        run: shopify theme check --fail-level=error
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Quick Asset Validation
        run: |
          # Check for basic issues
          echo "=== Quick Asset Check ==="
          
          # Check for large assets
          find assets/ -name "*.js" -size +200k -exec echo "⚠️ Large JS: {}" \; || true
          find assets/ -name "*.css" -size +100k -exec echo "⚠️ Large CSS: {}" \; || true
          
          # Basic JSON validation
          if [ -f "config/settings_schema.json" ]; then
            python3 -c "import json; json.load(open('config/settings_schema.json'))" && echo "✅ Schema JSON valid"
          fi
          
          echo "✅ Quick validation completed"

  # Deploy only after tests pass and only on push (not PR)
  deploy:
    name: Deploy theme
    needs: test
    if: github.event_name == 'push'  # Only deploy on push, not pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # These should be configured in repository Secrets
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine theme name and deployment strategy
        id: theme-config
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch: $BRANCH_NAME"
          
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "theme_name=Radiant" >> $GITHUB_OUTPUT
            echo "publish_flag=" >> $GITHUB_OUTPUT
            echo "Deploying to LIVE theme: Radiant"
          else
            echo "theme_name=Development" >> $GITHUB_OUTPUT
            echo "publish_flag=" >> $GITHUB_OUTPUT
            echo "Deploying to development theme: Development (will update existing)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Shopify CLI
        run: |
          npm install -g @shopify/cli || true

      - name: Deploy theme
        env:
          SHOPIFY_STORE: ${{ env.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ env.SHOPIFY_TOKEN }}
          THEME_NAME: ${{ steps.theme-config.outputs.theme_name }}
          PUBLISH_FLAG: ${{ steps.theme-config.outputs.publish_flag }}
        run: |
          echo "Deploying theme to store: $SHOPIFY_STORE"
          echo "Theme: $THEME_NAME"
          echo "Branch: ${{ github.ref_name }}"
          echo "Token set: $([ -n "$SHOPIFY_TOKEN" ] && echo "YES" || echo "NO")"
          
          if [ -z "$SHOPIFY_STORE" ] || [ -z "$SHOPIFY_TOKEN" ]; then
            echo "Missing required Shopify credentials. Aborting." >&2
            exit 1
          fi
          
          # Deploy using Admin API token (updates existing theme)
          shopify theme push $PUBLISH_FLAG \
            --store "$SHOPIFY_STORE" \
            --password "$SHOPIFY_TOKEN" \
            --theme "$THEME_NAME" \
            --force
