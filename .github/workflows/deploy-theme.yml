name: Test and Deploy Shopify Theme

on:
  push:
    branches:
      - main
      - develop
      - staging
      - '**'  # All branches
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Basic lint and validation only
  validate:
    name: Basic Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme
      
      - name: Theme Check (Errors Only)
        run: shopify theme check --fail-level=error
        
      - name: JSON Validation
        run: |
          # Validate settings schema
          if [ -f "config/settings_schema.json" ]; then
            python3 -c "import json; json.load(open('config/settings_schema.json'))" && echo "✅ Schema JSON valid"
          fi
          
          # Validate locales with better error handling
          if [ -d "locales" ]; then
            failed_files=()
            for locale_file in locales/*.json; do
              if [ -f "$locale_file" ]; then
                # Skip files that start with comments (they're not pure JSON)
                if head -1 "$locale_file" | grep -q "^/\*\|^//"; then
                  echo "⚠️ $(basename $locale_file) contains comments, skipping validation"
                  continue
                fi
                
                if python3 -c "import json; json.load(open('$locale_file'))" 2>/dev/null; then
                  echo "✅ $(basename $locale_file) valid"
                else
                  echo "❌ $(basename $locale_file) invalid JSON"
                  failed_files+=("$(basename $locale_file)")
                fi
              fi
            done
            
            # Fail the build if any critical locale files are invalid
            if [ ${#failed_files[@]} -gt 0 ]; then
              echo "Failed locale files: ${failed_files[*]}"
              echo "Please fix JSON syntax errors in locale files"
              exit 1
            fi
          fi

  # Deploy only after validation passes and only on push (not PR)
  deploy:
    name: Deploy theme
    needs: validate
    if: github.event_name == 'push'  # Only deploy on push, not pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # These should be configured in repository Secrets
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine theme name and deployment strategy
        id: theme-config
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch: $BRANCH_NAME"
          
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "theme_name=Radiant" >> $GITHUB_OUTPUT
            echo "publish_flag=" >> $GITHUB_OUTPUT
            echo "Deploying to LIVE theme: Radiant"
          else
            echo "theme_name=Development" >> $GITHUB_OUTPUT
            echo "publish_flag=" >> $GITHUB_OUTPUT
            echo "Deploying to development theme: Development (will update existing)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Shopify CLI
        run: |
          npm install -g @shopify/cli || true

      - name: Deploy theme
        env:
          SHOPIFY_STORE: ${{ env.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ env.SHOPIFY_TOKEN }}
          THEME_NAME: ${{ steps.theme-config.outputs.theme_name }}
          PUBLISH_FLAG: ${{ steps.theme-config.outputs.publish_flag }}
        run: |
          echo "Deploying theme to store: $SHOPIFY_STORE"
          echo "Theme: $THEME_NAME"
          echo "Branch: ${{ github.ref_name }}"
          echo "Token set: $([ -n "$SHOPIFY_TOKEN" ] && echo "YES" || echo "NO")"
          
          if [ -z "$SHOPIFY_STORE" ] || [ -z "$SHOPIFY_TOKEN" ]; then
            echo "Missing required Shopify credentials. Aborting." >&2
            exit 1
          fi
          
          # Deploy using Admin API token (updates existing theme)
          shopify theme push $PUBLISH_FLAG \
            --store "$SHOPIFY_STORE" \
            --password "$SHOPIFY_TOKEN" \
            --theme "$THEME_NAME" \
            --force
