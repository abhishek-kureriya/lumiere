name: Deploy Shopify theme on push

on:
  push:
    branches:
      - main
      - develop
      - staging
      - '**'  # All branches

jobs:
  deploy:
    name: Deploy theme
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # These should be configured in repository Secrets
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine theme name and deployment strategy
        id: theme-config
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch: $BRANCH_NAME"
          
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "theme_name=Radiant" >> $GITHUB_OUTPUT
            echo "publish_flag=" >> $GITHUB_OUTPUT
            echo "Deploying to LIVE theme: Radiant"
          else
            echo "theme_name=Development" >> $GITHUB_OUTPUT
            echo "publish_flag=--unpublished" >> $GITHUB_OUTPUT
            echo "Deploying to development theme: Development (unpublished)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Shopify CLI
        run: |
          npm install -g @shopify/cli || true

      - name: Deploy theme
        env:
          SHOPIFY_FLAG_STORE: ${{ env.SHOPIFY_STORE }}
          SHOPIFY_FLAG_CLIENT_ID: ${{ env.SHOPIFY_CLIENT_ID }}
          SHOPIFY_FLAG_CLIENT_SECRET: ${{ env.SHOPIFY_CLIENT_SECRET }}
          THEME_NAME: ${{ steps.theme-config.outputs.theme_name }}
          PUBLISH_FLAG: ${{ steps.theme-config.outputs.publish_flag }}
        run: |
          echo "Deploying theme to store: $SHOPIFY_FLAG_STORE"
          echo "Theme: $THEME_NAME"
          echo "Branch: ${{ github.ref_name }}"
          echo "Client ID set: $([ -n "$SHOPIFY_FLAG_CLIENT_ID" ] && echo "YES" || echo "NO")"
          echo "Client Secret set: $([ -n "$SHOPIFY_FLAG_CLIENT_SECRET" ] && echo "YES" || echo "NO")"
          
          if [ -z "$SHOPIFY_FLAG_STORE" ] || [ -z "$SHOPIFY_FLAG_CLIENT_ID" ] || [ -z "$SHOPIFY_FLAG_CLIENT_SECRET" ]; then
            echo "Missing required Shopify credentials. Aborting." >&2
            exit 1
          fi
          
          # Deploy using client credentials with explicit flags
          shopify theme push $PUBLISH_FLAG \
            --store "$SHOPIFY_FLAG_STORE" \
            --theme "$THEME_NAME" \
            --json \
            --force
